name: Bygg och släpp

# Släpp en ny version: höj "version" i src-tauri/tauri.conf.json och
# src-tauri/Cargo.toml, tagga (git tag v1.0.1 && git push --tags).
# Då byggs Mac (.dmg, Apple Silicon + Intel) och Windows (.exe + .msi),
# en release skapas och alla installerade appar uppdaterar sig själva.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Mac: signering och notarisering hos Apple sätts bara när certifikatet
      # finns. Tomma variabler får Tauri att försöka signera och fallera.
      - name: Apple-signering (om den finns)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Telink PBX AB (HQAGGRD9A8)"
            } >> "$GITHUB_ENV"
            echo "Signerar med Developer ID."
          else
            echo "Inget Apple-certifikat — bygger osignerat."
          fi
          # Notarisering med App Store Connect-nyckeln "fixra-notarisering"
          # (Developer-behörighet). Nyckel-id och utfärdare är inte hemliga.
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            KEYFILE="$RUNNER_TEMP/AuthKey_T8K6J43R53.p8"
            # Bygg om PEM-filen oavsett hur den klistrades in (radbrytningar
            # som försvunnit, mellanslag, \r). Bara base64-kroppen behålls.
            BODY=$(printf '%s' "$APPLE_API_PRIVATE_KEY" \
              | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' \
              | tr -d ' \r\n\t')
            {
              echo "-----BEGIN PRIVATE KEY-----"
              printf '%s' "$BODY" | fold -w 64
              echo
              echo "-----END PRIVATE KEY-----"
            } > "$KEYFILE"
            if openssl pkey -in "$KEYFILE" -noout 2>/dev/null; then
              echo "Notariseringsnyckeln är giltig."
            else
              echo "::error::APPLE_API_PRIVATE_KEY går inte att läsa som nyckel — klistra in hela AuthKey_T8K6J43R53.p8 igen."
              exit 1
            fi
            {
              echo "APPLE_API_KEY=T8K6J43R53"
              echo "APPLE_API_ISSUER=d941c532-ff70-43d4-b923-5a5634c78112"
              echo "APPLE_API_KEY_PATH=$KEYFILE"
            } >> "$GITHUB_ENV"
            echo "Notariserar hos Apple."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uppdateringssignaturen (obligatorisk — utan den vägrar appen uppdatera).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Fixra __VERSION__"
          releaseBody: "Fixra för Mac och Windows. Mac: ladda ner .dmg. Windows: ladda ner -setup.exe."
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
