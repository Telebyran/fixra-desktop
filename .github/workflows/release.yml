name: Bygg och släpp

# Släpp en ny version: höj "version" i src-tauri/tauri.conf.json och
# src-tauri/Cargo.toml, tagga (git tag v1.0.1 && git push --tags).
# Då byggs Mac (.dmg, Apple Silicon + Intel) och Windows (.exe + .msi),
# en release skapas och alla installerade appar uppdaterar sig själva.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uppdateringssignaturen (obligatorisk — utan den vägrar appen uppdatera).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Mac: signering och notarisering hos Apple. Saknas de byggs appen
          # ändå, men macOS varnar vid första start.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Fixra __VERSION__"
          releaseBody: "Fixra för Mac och Windows. Mac: ladda ner .dmg. Windows: ladda ner -setup.exe."
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
